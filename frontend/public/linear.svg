<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Linear">
  <!--
    Redrawn from primitives.

    The asset this replaces was corrupt: two of its three paths carried
    malformed curve data ("c-.2224.9485-1.2-.2204-1.9159.7159"), so it rendered
    as a pair of diagonal slabs rather than the mark. This is a clean geometric
    construction of the same shape — a squircle with the diagonal bars — which
    is sharp at 22px and cannot rot the way hand-edited bezier data does.

    Swap in Linear's official asset from their brand page when convenient; the
    filename and viewBox match, so nothing else has to change.
  -->
  <defs>
    <clipPath id="linear-squircle">
      <rect x="4" y="4" width="92" height="92" rx="26" ry="26" />
    </clipPath>
  </defs>
  <g clip-path="url(#linear-squircle)" fill="#5E6AD2">
    <!-- Three parallel diagonals of increasing length, running corner to
         corner. Drawn as rotated rects so the ends stay square against the
         clip, which is what gives the mark its cut-off look. -->
    <g transform="rotate(-45 50 50)">
      <rect x="-14" y="24" width="128" height="11" rx="5.5" />
      <rect x="-14" y="44.5" width="128" height="11" rx="5.5" />
      <rect x="-14" y="65" width="128" height="11" rx="5.5" />
    </g>
  </g>
</svg>
