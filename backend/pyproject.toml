[project]
name = "locus-backend"
version = "1.0.0"
description = "Locus — cross-tool context for IT work. Local-first LLM, PR Context Agent."
readme = "../README.md"
requires-python = ">=3.11,<3.14"

dependencies = [
    # Web framework
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",

    # Database
    "sqlalchemy>=2.0.52",
    "psycopg2-binary>=2.9.12",
    "alembic>=1.19.1",

    # Security
    # bcrypt used directly; passlib is unmaintained and breaks on bcrypt >= 5.
    "bcrypt>=5.0.0",
    "cryptography>=50.0.1",
    "python-jose[cryptography]>=3.5.0",

    # Environment
    "python-dotenv>=1.2.3",
    "email-validator>=2.3.0",

    # LangChain 1.x. AgentExecutor was removed in 1.0; the agent now uses
    # `create_agent`, which returns a compiled LangGraph.
    "langchain>=1.3.18",
    "langchain-core>=1.6.1",
    "langchain-openai>=1.6.0",
    "langgraph>=1.2.11",

    # Timezone-aware date parsing (IST default)
    "dateparser>=1.4.3",

    # Integration SDKs
    "atlassian-python-api>=5.0.4",
    "google-api-python-client>=2.200.0",
    "google-auth-httplib2>=0.4.2",
    "google-auth-oauthlib>=1.4.1",
    "slack-sdk>=3.44.1",
    "notion-client>=3.1.0",

    # HTTP
    "requests>=2.34.2",
    "httpx>=0.28.1",
]

[project.optional-dependencies]
# Deterministic security scanning for the PR Context Agent. Without these the
# confirmed-findings half of the scan is skipped and only the unverified LLM
# pass runs.
security = [
    "semgrep>=1.176.0",
]

# Hosted model providers. OpenAI and Gemini speak the OpenAI wire format and
# need nothing beyond langchain-openai, which is already a core dependency;
# Anthropic does not, so LLM_PROVIDER=anthropic needs this extra.
hosted = [
    "langchain-anthropic>=1.7.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.5",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E501",   # line length is handled by the formatter
    "B008",   # FastAPI's Depends() in defaults is the documented pattern
    "UP042",  # str+Enum is intentional: Pydantic serializes these to plain strings
]

[tool.ruff.lint.per-file-ignores]
# The integration service modules predate this config. They use bare excepts as
# a blanket "never let a third-party SDK crash the agent" guard. Worth cleaning
# up alongside the credential-globals refactor, not in a lint pass.
"app/services/integrations/bugasura.py" = ["E722"]
"app/services/integrations/calendar.py" = ["E722"]
"app/services/integrations/github.py" = ["E741"]
"app/services/integrations/gmail.py" = ["E722"]
"app/services/integrations/google_docs.py" = ["E722"]
"app/services/integrations/google_drive.py" = ["E722", "F841"]
"app/services/integrations/google_forms.py" = ["E722"]
"app/services/integrations/google_meet.py" = ["E722"]
"app/services/integrations/google_sheets.py" = ["E722"]
"app/services/integrations/google_slides.py" = ["E722"]
"app/services/integrations/jira.py" = ["E701", "E741", "F841"]
"app/services/integrations/linear.py" = ["E741"]
"app/routers/google_oauth.py" = ["E722"]
# Migrations insert the project root on sys.path before importing app.*
"migrations/*.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
